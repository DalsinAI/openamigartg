name: OpenTensor First Light

on:
  push:
    branches:
      - demo/opentensor-first-light-20261012
    paths:
      - demos/opentensor/**
      - .github/workflows/opentensor-amigaos3.yml
  workflow_dispatch:

concurrency:
  group: opentensor-first-light
  cancel-in-progress: true

jobs:
  build:
    name: Build Mesa AHI OpenRTG demo
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Inspect SDK
        shell: bash
        run: |
          set -euxo pipefail
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16"
          "$STOVE/prefix/bin/m68k-amigaos-gcc" --version | head -1
          test -f "$STOVE/prefix/m68k-amigaos/include/GL/gl.h"
          test -f "$STOVE/prefix/m68k-amigaos/include/devices/ahi.h" || \
            test -f "$HOME/AmigaChrome/stoves/os32/prefix/m68k-amigaos/include/devices/ahi.h"
          find "$STOVE/prefix" -type f -name libGL.a -print

      - name: Build OpenTensor
        shell: bash
        run: |
          set -euxo pipefail
          STOVE="$HOME/AmigaChrome/stoves/os32-gcc16" \
            sh demos/opentensor/build.sh "$PWD/build/opentensor"

      - name: Verify package
        shell: bash
        run: |
          set -euxo pipefail
          OUT=build/opentensor
          BIN="$OUT/package/OpenTensor/OpenTensor"
          test -s "$BIN"
          file "$BIN"
          strings "$BIN" | grep -F 'OpenTensor: First Light'
          strings "$BIN" | grep -F 'MESA / AHI / OPENRTG'
          strings "$BIN" | grep -F 'AHI'
          test -s "$OUT/OpenTensor-First-Light-0.1.0.zip"
          sha256sum -c "$OUT/SHA256SUMS"
          cat "$OUT/package/OpenTensor/BUILD-INFO.txt"

      - name: Upload first-light package
        uses: actions/upload-artifact@v4
        with:
          name: OpenTensor-First-Light-0.1.0
          path: |
            build/opentensor/OpenTensor-First-Light-0.1.0.zip
            build/opentensor/SHA256SUMS
            build/opentensor/package/OpenTensor/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

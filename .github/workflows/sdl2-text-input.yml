name: SDL2 Amiga Text Input

on:
  push:
    branches:
      - implement/opengpu-sdl-keyboard-fix
  workflow_dispatch:

concurrency:
  group: openrtg-sdl2-text-input
  cancel-in-progress: true

jobs:
  patch-check:
    name: Apply patches and check SDLTextCheck source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Apply AmigaOS backend patch series
        shell: bash
        run: |
          set -euxo pipefail
          git clone -q https://github.com/bdgscotland/libSDL2-amigaos3.git backend
          git -C backend checkout -q 1eefa8f35c5ad4b63fa835e251e801a9315dff5c
          for p in library/modules/sdl2/patches/amigaos3/*.patch; do
            patch --batch --forward -s -p1 -d backend < "$p"
          done
          git -C backend diff --check
          grep -F 'MapRawKey' backend/src/video/amigaos3/SDL_os3events.c
          grep -F 'SDL_SendKeyboardText' backend/src/video/amigaos3/SDL_os3events.c
          grep -F 'keymap.library' backend/src/video/amigaos3/SDL_os3video.c

      - name: Syntax-check SDLTextCheck against SDL 2.32.10 headers
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL -o SDL2-2.32.10.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          echo '5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165  SDL2-2.32.10.tar.gz' | sha256sum -c -
          tar xzf SDL2-2.32.10.tar.gz
          cc -std=c11 -Wall -Wextra -Werror \
            -I SDL2-2.32.10/include -fsyntax-only tests/sdl2/textinput.c

  build:
    name: Build SDL2.module and SDLTextCheck
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Runner identity
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          uname -a
          echo "HOME=$HOME"
          git rev-parse HEAD
          test -x "$HOME/AmigaChrome/stoves/os32-gcc16/prefix/bin/m68k-amigaos-gcc"
          "$HOME/AmigaChrome/stoves/os32-gcc16/prefix/bin/m68k-amigaos-gcc" --version | head -1

      - name: Build shared and static SDL2
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/build/sdl2-text-input"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          library/modules/sdl2/build.sh "$OUT" module stub static

      - name: Build SDLTextCheck both ways
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/build/sdl2-text-input"
          CC="$HOME/AmigaChrome/stoves/os32-gcc16/prefix/bin/m68k-amigaos-gcc"
          mkdir -p "$OUT/tests/sdl2"
          "$CC" -O2 -m68040 -m68881 -fno-delete-null-pointer-checks -noixemul \
            -I"$OUT/include/SDL2" -o "$OUT/tests/sdl2/textinput.m" \
            tests/sdl2/textinput.c -L"$OUT" -lSDL2 -lm -lamiga
          "$CC" -O2 -m68040 -m68881 -fno-delete-null-pointer-checks -noixemul \
            -I"$OUT/include/SDL2" -o "$OUT/tests/sdl2/textinput" \
            tests/sdl2/textinput.c -L"$OUT" -lSDL2_static -lm -lamiga
          file "$OUT/SDL2.module" "$OUT/tests/sdl2/textinput.m" "$OUT/tests/sdl2/textinput"
          sha256sum "$OUT/SDL2.module" "$OUT/tests/sdl2/textinput.m" \
            "$OUT/tests/sdl2/textinput" | tee "$OUT/SHA256SUMS-text-input"

      - name: Publish build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenGPU-SDL2-TextInput-${{ github.run_id }}
          path: |
            build/sdl2-text-input/SDL2.module
            build/sdl2-text-input/libSDL2.a
            build/sdl2-text-input/libSDL2_static.a
            build/sdl2-text-input/tests/sdl2/textinput
            build/sdl2-text-input/tests/sdl2/textinput.m
            build/sdl2-text-input/SHA256SUMS-text-input
          if-no-files-found: warn
          retention-days: 30

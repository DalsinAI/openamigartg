# Big-endian 68040 Linux: checks Mesa and GLA on the Amiga's byte order and CPU under qemu-m68k.
# -fno-delete-null-pointer-checks as in the AmigaOS cross file, so the code
# checked here is made the same way as the Amiga's.
[binaries]
c = 'm68k-linux-gnu-gcc'
cpp = 'm68k-linux-gnu-g++'
ar = 'm68k-linux-gnu-ar'
strip = 'm68k-linux-gnu-strip'
pkg-config = 'false'
exe_wrapper = ['qemu-m68k', '-cpu', 'm68040']

[built-in options]
c_args = ['-m68040', '-fno-delete-null-pointer-checks']
cpp_args = ['-m68040', '-fno-delete-null-pointer-checks']
c_link_args = ['-m68040', '-fno-delete-null-pointer-checks', '-static']
cpp_link_args = ['-m68040', '-fno-delete-null-pointer-checks', '-static']

[host_machine]
system = 'linux'
cpu_family = 'm68k'
cpu = 'm68040'
endian = 'big'

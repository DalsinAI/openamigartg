# AmigaOS 3.2 on a 68040 with FPU: the GCC 16 stove (os32-gcc16), whose bin/
# must be first on PATH. Mesa needs C11 and C++17, so the GCC 6.5 stove won't
# do. The stove has pthread.h and libpthread; 64-bit atomics come from its
# libatomic. mesa/amigaos/posix_shim.h fills libnix's POSIX gaps; build.sh
# links its posix_shim.c. Static libraries are built without PIC
# (b_staticpic, set by build.sh), as the AmigaOS assembler has no GOT.
# uint32_t is unsigned long here, so Mesa's unsigned-int callbacks, %u
# formats and C++ pointer conversions are warnings, not errors (the same
# size, so the same code). _GNU_SOURCE opens newlib's M_PI and friends.
# -m68040 and GCC's bit-field instructions, measured on 8 October 2026 (the
# GL module's README, "Speed on the 68k"): -m68020 -m68881 halves softpipe's
# frame rate on the AC090, and -mnobitfield cost a third of it on the
# runtime of that day (and nothing on the JIT of amigachrome #293), so
# neither is used.
[binaries]
c = 'm68k-amigaos-gcc'
cpp = 'm68k-amigaos-g++'
ar = 'm68k-amigaos-ar'
strip = 'm68k-amigaos-strip'
pkg-config = 'false'

[built-in options]
c_args = ['-m68040', '-m68881', '-noixemul', '-fomit-frame-pointer', '-Wno-error=incompatible-pointer-types', '-D_GNU_SOURCE', '-Wno-error=format', '-include', '@DIRNAME@/../amigaos/posix_shim.h']
cpp_args = ['-m68040', '-m68881', '-noixemul', '-fomit-frame-pointer', '-D_GNU_SOURCE', '-Wno-error=format', '-fpermissive', '-include', '@DIRNAME@/../amigaos/posix_shim.h']
c_link_args = ['-m68040', '-m68881', '-noixemul', '-lpthread', '-latomic']
cpp_link_args = ['-m68040', '-m68881', '-noixemul', '-lpthread', '-latomic']

[host_machine]
system = 'amigaos'
cpu_family = 'm68k'
cpu = 'm68040'
endian = 'big'
